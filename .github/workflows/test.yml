name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit and end-to-end tests (offline)
        run: python -m unittest discover -s tests -t . -v

      - name: Install the package and run the console script
        run: |
          python -m pip install --no-cache-dir .
          cd "$RUNNER_TEMP"
          hc-proof --version
          hc-proof collect --script | cmp - "$GITHUB_WORKSPACE/collect.sh"
          hc-proof collect > collector-output.txt
          head -n 3 collector-output.txt
