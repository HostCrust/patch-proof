[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-proof"
dynamic = ["version"]
description = "HostCrust Patch Proof: which CVEs are really open on your Linux server, counting backported fixes and the running kernel (Ubuntu, Debian, AlmaLinux, Rocky Linux)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "HostCrust", email = "hello@hostcrust.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "cve",
    "vulnerability-scanner",
    "backport",
    "linux-kernel",
    "ubuntu",
    "debian",
    "almalinux",
    "rocky-linux",
    "osv",
    "patch-management",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://hostcrust.com/proof"
Repository = "https://github.com/HostCrust/patch-proof"
Issues = "https://github.com/HostCrust/patch-proof/issues"
Documentation = "https://github.com/HostCrust/patch-proof#readme"

[project.scripts]
hc-proof = "hcproof.cli:main"

[tool.setuptools]
packages = ["hcproof"]

[tool.setuptools.package-data]
hcproof = ["collect.sh"]

[tool.setuptools.dynamic]
version = { attr = "hcproof.__version__" }
